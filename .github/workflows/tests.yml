# pytest 자동 실행 CI
#
# 왜 필요한가?
# 로컬에서는 통과했지만, GitHub에 올라간 코드가 실제로도 테스트를 통과하는지는
# 별개 문제입니다. 예를 들어 커밋에서 파일 하나를 빠뜨렸거나, 로컬에만 설치된
# 패키지에 의존하고 있으면 다른 사람이 clone했을 때 바로 깨집니다.
# 이 워크플로는 push/PR마다 깨끗한 환경에서 설치부터 테스트까지 다시 돌려
# "clone하면 실제로 동작하는 저장소"임을 자동으로 증명합니다.

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 테스트 실행
        run: pytest -v
